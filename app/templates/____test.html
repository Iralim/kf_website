<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Critical CSS встроенный -->
    <style>
    .hero-section{min-height:100vh;position:relative}
    .hero-title{font-size:clamp(2rem,5vw,3.5rem);line-height:1.2}
    /* ... остальные необходимые стили ... */
    </style>
    
    <!-- Предзагрузка важных ресурсов -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" as="style">
    
    <!-- Остальные стили асинхронно -->
    <link rel="stylesheet" href="bootstrap-icons.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="main.css" media="print" onload="this.media='all'">
</head>
<body>
    <section id="home" class="hero-section">
        <div class="container">
            <div class="row align-items-center min-vh-100">
                <div class="col-lg-8">
                    <div class="hero-content">
                        <!-- Упрощенные анимации -->
                        <div class="hero-badge">
                            <i class="bi bi-award-fill"></i>
                            Строим с 2010 года
                        </div>
                        
                        <h1 class="hero-title">
                            Строим современные<br>
                            <span class="hero-highlight">энергоэффективные</span><br>
                            дома под ключ
                        </h1>
                        
                        <div class="technology-badge">
                            <i class="bi bi-lightning-charge"></i>
                            Технология: СИП-панели
                        </div>
                        
                        <p class="hero-subtitle">
                            Премиум-качество <span class="text-accent">без переплаты</span>
                        </p>
                        
                        <!-- Геолокации - можно оптимизировать иконки -->
                        <div class="hero-locations">
                            <div class="location-item">
                                <svg width="16" height="16" fill="currentColor"><use href="#geo-icon"></use></svg>
                                <span>Стерлитамак</span>
                            </div>
                            <!-- ... остальные локации ... -->
                        </div>
                        
                        <div class="hero-actions">
                            <a href="#contact" class="btn btn-primary-custom">
                                <i class="bi bi-house-check me-2"></i>
                                Получить консультацию
                            </a>
                            <a href="#projects" class="btn btn-outline-custom">
                                <i class="bi bi-images me-2"></i>
                                Смотреть проекты
                            </a>
                        </div>
                        
                        <div class="hero-features">
                            <div class="feature-item">
                                <i class="bi bi-clock-fill"></i>
                                <span>3 месяца</span>
                            </div>
                            <!-- ... остальные преимущества ... -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- SVG спрайт для иконок -->
    <svg style="display:none">
        <symbol id="geo-icon" viewBox="0 0 16 16">
            <path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10zm0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
        </symbol>
    </svg>

    <!-- Скрипты в конце body -->
    <script>
    // Загрузка AOS только при необходимости
    if (window.innerWidth > 768) {
        const aosScript = document.createElement('script');
        aosScript.src = 'https://unpkg.com/aos@2.3.1/dist/aos.js';
        aosScript.async = true;
        document.body.appendChild(aosScript);
        
        aosScript.onload = function() {
            AOS.init({duration: 800, once: true});
        }
    }
    </script>
</body>
</html>
